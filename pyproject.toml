[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "fairopt-fairness"
version = "0.1.0"
description = "Fair optimal transport experiments (F1-F3): individual, group, and mixed group+individual fairness"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "openml>=0.14",
    "tqdm>=4.65",
]

[project.optional-dependencies]
viz = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
packages = [
    "fairopt",
    "fairopt.core",
    "fairopt.data",
    "fairopt.experiments",
    "fairopt.solvers",
    "fairopt.utils",
]
